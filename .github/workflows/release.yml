# Turns a version tag into a GitHub Release, so the Releases page never lags behind the tags again.
# The notes are the section of CHANGELOG.md for that version: one place to write them, no copying.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the notes for this version from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          # A release with empty notes is useless: fail loudly instead, so the changelog gets the entry.
          if [ ! -s /tmp/notes.md ]; then
            echo "no section for $version in CHANGELOG.md" >&2
            exit 1
          fi
          echo "notes for $version: $(wc -l < /tmp/notes.md) lines"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
